[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    -p no:cacheprovider
    --ignore=tests/generated
    --ignore=tests/test_argoscore_functions.py
    --ignore=tests/test_bump_version.py
    --ignore=tests/test_core_ollama_bootstrap.py
    --ignore=tests/test_debug_logging.py
    --ignore=tests/test_git_guard.py
    --ignore=tests/test_jarvis_engine.py
    --ignore=tests/test_life_support.py
    --ignore=tests/test_life_support_v2.py
    --ignore=tests/test_messenger_bridges.py
    --ignore=tests/test_ollama_timeout_autostart.py
    --ignore=tests/test_p2p.py
    --ignore=tests/test_platform_admin.py
    --ignore=tests/test_quantum_logic_homeostasis.py
    --ignore=tests/test_telegram_bot_file.py
    --ignore=tests/test_telegram_bot_history_scope.py
    --ignore=tests/test_telegram_bot_voice.py
    --ignore=tests/test_whisper_node.py
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
norecurseddirs = .git .buildozer venv .venv __pycache__ dist build node_modules tests/generated
