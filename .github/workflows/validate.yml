name: Validate & Release Preparation
on:
  push:
    branches: [main, "release/*", "codex/repair-status-report-ci"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install pytest
      - name: Validate Python syntax
        run: python3 scripts/check_python_syntax.py
      - name: Validate project
        run: python3 validate_project.py
      - name: Run tests
        run: pytest -q
