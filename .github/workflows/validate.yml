name: Validate & Release Preparation
on:
  push:
    branches: [main, "release/*", "codex/repair-status-report-ci"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-asyncio requests psutil fastapi httpx uvicorn python-dotenv redis pyyaml aiohttp openai huggingface-hub scikit-learn python-telegram-bot beautifulsoup4 aiosqlite cryptography cffi
      - name: Validate Python syntax
        run: python3 scripts/check_python_syntax.py
      - name: Validate project
        run: python3 validate_project.py
      - name: Run tests
        run: pytest -q
      - name: Test deployed helpers without external services
        working-directory: argos_deploy
        timeout-minutes: 2
        run: >-
          python -m pytest --rootdir=. -c ../pytest.ini --import-mode=importlib
          --noconftest tests/test_browser_conduit.py
          tests/test_requirements_runtime_deps.py tests/test_runtime_test_isolation.py
          tests/test_cloud_auth.py tests/test_ai_provider_configuration.py
          tests/test_legacy_recovery_build.py tests/test_gist_initialization.py
          tests/test_gemini_compatibility.py tests/test_huggingface_model_configuration.py
          tests/test_peer_autoconnect_port.py tests/test_mempalace_sqlite_recovery.py
          tests/test_core_recovered_memory_context.py tests/test_ollama_prompt_context.py
          tests/test_safe_arithmetic.py tests/test_ollama_input_policy.py
          tests/test_core_direct_results.py tests/test_direct_file_commands.py
          tests/test_core_ollama_input_guard.py tests/test_execution_reporting.py
          tests/test_memory_index.py tests/test_task_control.py tests/test_task_runtime.py
          tests/test_task_runtime_edges.py tests/test_control_api.py tests/test_control_integration.py
          tests/test_golden_application.py
          -q -o addopts=''
      - name: Test deployed runtime modules with isolated fixtures
        working-directory: argos_deploy
        timeout-minutes: 2
        run: >-
          python -m pytest --rootdir=. -c ../pytest.ini --import-mode=importlib
          tests/test_file_operations.py tests/test_self_healing.py
          tests/test_pricing.py tests/test_tool_calling.py -q -o addopts=''
