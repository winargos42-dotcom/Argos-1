name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@6fc1aa3e2a08b9d1b655fb7ed29a0bc532a4d480
    with:
      source_ref: 6fc1aa3e2a08b9d1b655fb7ed29a0bc532a4d480
    permissions:
      contents: read
