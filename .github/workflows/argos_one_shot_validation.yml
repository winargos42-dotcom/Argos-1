name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@f6df2abd40da61ab92789f13a03cab428c7003fe
    with:
      source_ref: f6df2abd40da61ab92789f13a03cab428c7003fe
    permissions:
      contents: read
