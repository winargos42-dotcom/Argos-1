name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@5a8ef3ff5dce8ecce02a7b96dfddf89dbf695e78
    with:
      source_ref: 5a8ef3ff5dce8ecce02a7b96dfddf89dbf695e78
    permissions:
      contents: read
