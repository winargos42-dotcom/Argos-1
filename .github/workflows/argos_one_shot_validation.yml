name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: false

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@7fd9e1ec54e3c34862319054ae4747533ce80075
    with:
      source_ref: 7fd9e1ec54e3c34862319054ae4747533ce80075
    permissions:
      contents: read
