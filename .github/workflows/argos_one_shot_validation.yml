name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: false

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@e6c73f5f771065f64c3d675c8030fb38f55c33ec
    with:
      source_ref: e6c73f5f771065f64c3d675c8030fb38f55c33ec
    permissions:
      contents: read
