name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@77624b9349c1567fcfa7d3eac5a971b12a9178b0
    with:
      source_ref: 77624b9349c1567fcfa7d3eac5a971b12a9178b0
    permissions:
      contents: read
