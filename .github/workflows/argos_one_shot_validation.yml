name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@dfcaa7cfb57d2a87c110a8b492f97ce2196ec091
    with:
      source_ref: dfcaa7cfb57d2a87c110a8b492f97ce2196ec091
    permissions:
      contents: read
