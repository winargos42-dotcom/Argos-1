name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: false

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@c64c9609ff180c4e8de193396335a52e34b4e82a
    with:
      source_ref: c64c9609ff180c4e8de193396335a52e34b4e82a
    permissions:
      contents: read
