name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@f67dab3d3323b251cc469d12a6c54ed841e785cc
    with:
      source_ref: f67dab3d3323b251cc469d12a6c54ed841e785cc
    permissions:
      contents: read
