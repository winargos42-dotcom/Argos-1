name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@b8a6e2ae4206fad2acd39632a32cf0d4073c1e7d
    with:
      source_ref: b8a6e2ae4206fad2acd39632a32cf0d4073c1e7d
    permissions:
      contents: read
