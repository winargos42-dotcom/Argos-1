name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@dbeaac09b4b80d680d3c62ed5dff59ffaa698955
    with:
      source_ref: dbeaac09b4b80d680d3c62ed5dff59ffaa698955
    permissions:
      contents: read
