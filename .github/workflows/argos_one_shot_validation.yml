name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@d71ad77ad46f1bbf17fe52d9e57842dc742f6b0a
    with:
      source_ref: d71ad77ad46f1bbf17fe52d9e57842dc742f6b0a
    permissions:
      contents: read
