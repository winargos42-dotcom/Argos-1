name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@3241f24d0623cbdd9e58456f994f35d997f50013
    with:
      source_ref: 3241f24d0623cbdd9e58456f994f35d997f50013
    permissions:
      contents: read
