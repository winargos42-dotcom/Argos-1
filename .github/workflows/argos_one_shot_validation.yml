name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: false

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@534eff43fe645abfcd04b2a24f20f3ba2092072f
    with:
      source_ref: 534eff43fe645abfcd04b2a24f20f3ba2092072f
    permissions:
      contents: read
