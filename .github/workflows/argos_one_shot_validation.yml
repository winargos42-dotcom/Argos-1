name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: false

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@0b8737716141d12900d80d004e57bb0ea88e384e
    with:
      source_ref: 0b8737716141d12900d80d004e57bb0ea88e384e
    permissions:
      contents: read
