name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@3a514f52fb95ca714e2a4de0e39a6eee4b52e289
    with:
      source_ref: 3a514f52fb95ca714e2a4de0e39a6eee4b52e289
    permissions:
      contents: read
