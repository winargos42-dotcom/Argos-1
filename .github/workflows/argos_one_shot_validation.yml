name: ARGOS One-Shot Release Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argos_one_shot_validation.yml
  workflow_dispatch:

concurrency:
  group: argos-one-shot-release-validation
  cancel-in-progress: false

jobs:
  validate-release:
    name: Run pinned ARGOS release validation
    uses: winargos42-dotcom/Argos-1/.github/workflows/ci.yml@5683d16e7fe795a83ee8932b8c38b9e348b226da
    with:
      source_ref: 5683d16e7fe795a83ee8932b8c38b9e348b226da
    permissions:
      contents: read
