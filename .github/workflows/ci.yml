name: CI — Release Validation
on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated application test dependencies
        run: pip install pytest-cov pytest-asyncio requests psutil fastapi httpx uvicorn python-dotenv redis pyyaml aiohttp openai huggingface-hub scikit-learn python-telegram-bot beautifulsoup4 aiosqlite cryptography cffi
      - name: Validate Python syntax
        run: python3 scripts/check_python_syntax.py
      - name: Validate project
        run: python3 validate_project.py
      - name: Test repository validation tools
        run: python -m pytest tests -q
      - name: Test deployed application and enforce 30 percent coverage
        timeout-minutes: 10
        run: python scripts/test_deployed_app.py
      - name: Upload full application coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-application-coverage
          path: artifacts/app-coverage/
          if-no-files-found: warn
