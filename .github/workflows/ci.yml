name: CI — Release Validation

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Exact source revision to validate and package"
        required: false
        type: string
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Test deployed runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             pytest pytest-cov chardet PyYAML             python-dotenv requests psutil fastapi uvicorn httpx pydantic             redis GitPython numpy scikit-learn cryptography packaging             aiofiles aiosqlite SQLAlchemy argon2-cffi beautifulsoup4 huggingface-hub

      - name: Validate deployed Python syntax
        run: |
          python -m py_compile             argos_deploy/cloud_entry.py             argos_deploy/src/core.py             argos_deploy/src/health_details.py             argos_deploy/src/mempalace_bridge.py

      - name: Run full deployed-runtime test suite
        working-directory: argos_deploy
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest --rootdir=. -c /dev/null tests
          --ignore=tests/generated
          --cov=src --cov-fail-under=30 -q --tb=short

  build-apk:
    name: APK after tests
    needs: validate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build_apk.yml
    with:
      release_mode: debug
      source_ref: ${{ inputs.source_ref || github.sha }}
    permissions:
      contents: read

  build-windows:
    name: Windows installer after APK
    needs: build-apk
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build_windows.yml
    with:
      one_file: onefile
      source_ref: ${{ inputs.source_ref || github.sha }}
    permissions:
      contents: read

  android-smoke:
    name: Install and launch APK on Android
    needs: build-windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download APK from this run
        uses: actions/download-artifact@v4
        with:
          pattern: argos-apk-debug-*
          path: artifacts
          merge-multiple: true

      - name: Boot emulator, install, and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$(find artifacts -name '*.apk' -print -quit)"
            test -n "$APK"
            adb install -r "$APK"
            adb shell monkey -p org.iliyaqdrwalqu.argos.argos_universal \
              -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof org.iliyaqdrwalqu.argos.argos_universal
            adb shell uiautomator dump /sdcard/argos-window.xml
            adb pull /sdcard/argos-window.xml android-smoke-window.xml
            adb logcat -d > android-smoke-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: org\\.iliyaqdrwalqu\\.argos\\.argos_universal.*has died" \
              android-smoke-logcat.txt

      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ github.run_number }}
          path: |
            android-smoke-window.xml
            android-smoke-logcat.txt
          if-no-files-found: warn
          retention-days: 30
