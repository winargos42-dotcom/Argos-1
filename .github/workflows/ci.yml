name: CI — Release Validation
on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install audio build dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y portaudio19-dev
      - name: Install dependencies
        run: |
          pip install pytest-cov
          pip install -r requirements.txt --quiet
      - name: Validate Python syntax
        run: python3 scripts/check_python_syntax.py
      - name: Validate project
        run: python3 validate_project.py
      # Currently collected CI tests exercise status_report.py, not the src/ runtime.
      # Keep a real 30% coverage gate on tested code rather than reporting 0% src
      # as though these tests executed application modules. Add src-specific tests
      # before creating a separate enforced src/ coverage gate.
      - name: Run tests with honest status-report coverage
        run: pytest --cov=status_report --cov-fail-under=30 --cov-report=term -q --tb=short
