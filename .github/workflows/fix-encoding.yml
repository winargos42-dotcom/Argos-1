name: Python source validation

on:
  push:
    branches: [main, develop, 'release/*', 'codex/repair-status-report-ci']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate UTF-8 and Python syntax
        run: python3 scripts/check_python_syntax.py
