# This is a workflow file for Argoss

name: Argos Report to Gist

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Report Gist publication status
        run: |
          echo "::warning::Gist publication is not connected: this workflow has not uploaded a report."
          echo "No Gist was updated. Connect report generation and the publisher to a verified target before relying on this workflow as a backup." >> "$GITHUB_STEP_SUMMARY"
